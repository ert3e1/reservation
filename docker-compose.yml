services:
  app:
    build:
      context: .
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8081:8000"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build:
      context: .
    working_dir: /var/www/html
    command: php artisan queue:work database --sleep=1 --tries=1 --timeout=60
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: housing
      MYSQL_USER: housing
      MYSQL_PASSWORD: housing
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
